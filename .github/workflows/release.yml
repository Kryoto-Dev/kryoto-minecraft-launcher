name: Release

# Fires on a VERSION BUMP, as Kryoto Desktop's does: the first job reads the
# version out of src-tauri/tauri.conf.json and stops unless it has no tag yet.
# So the ritual is: bump the version in package.json, src-tauri/Cargo.toml,
# crates/kryoto-mc/Cargo.toml and src-tauri/tauri.conf.json, and the two
# crates' entries in src-tauri/Cargo.lock and crates/kryoto-mc/Cargo.lock
# (builds run --locked), add the CHANGELOG.md entry, push to main.
#
# The installers land on a draft release: Windows (NSIS setup), Linux
# (AppImage, .deb, .rpm). Beside each is the in-app updater's minisign
# signature, and once every platform is up, latest.json, which installed
# copies read from releases/latest/download/latest.json. Signing uses the
# TAURI_SIGNING_PRIVATE_KEY secret (and _PASSWORD), the launcher's own key,
# whose public half is plugins.updater.pubkey in tauri.conf.json. Only then is
# the release published.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          app=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          engine=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/kryoto-mc/Cargo.toml | head -n 1)
          if [ "$version" != "$pkg" ] || [ "$version" != "$app" ] || [ "$version" != "$engine" ]; then
            echo "::error::Versions differ: tauri.conf.json $version, package.json $pkg, src-tauri $app, kryoto-mc $engine."
            exit 1
          fi
          if ! grep -q "^## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.check.outputs.version }}
        run: |
          # A draft left by a run that failed part-way would sit beside this one.
          gh release delete "v$V" --yes 2>/dev/null || true
          notes=$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "v$V" --draft --target "$GITHUB_SHA" --title "Kryoto Minecraft Launcher $V" --notes "$notes"

  build:
    needs: [check, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # 22.04: the oldest glibc the AppImage and .deb should run on, and
          # the Tauri packages below keep these names there.
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev rpm
      - name: Require the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set: without it there is no latest.json and no installed copy ever updates."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # PowerShell on Windows: in a bash step Git's MSYS `link` shadows MSVC's.
      - name: Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path crates/kryoto-mc/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check (Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm build
          cargo test --locked --manifest-path crates/kryoto-mc/Cargo.toml
      - name: Build the installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # `tauri build` only warns when the key doesn't match the public key,
        # and every installed copy would then refuse the update. Fail instead.
        run: |
          pnpm app:build *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path build.log -Pattern "does not match the public key" -Quiet) { Write-Output "::error::The signing key doesn't match plugins.updater.pubkey."; exit 1 }
      - name: Build the installers (Linux)
        if: runner.os == 'Linux'
        env:
          # The AppImage tooling is itself an AppImage; without FUSE on the
          # runner it has to unpack itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          pnpm app:build 2>&1 | tee build.log
          if grep -q "does not match the public key" build.log; then
            echo "::error::The signing key doesn't match plugins.updater.pubkey."
            exit 1
          fi
      - name: Attach them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.check.outputs.version }}"
          bundle=src-tauri/target/release/bundle
          name="Kryoto-Minecraft-Launcher_${v}"
          mkdir -p out
          # Plain names (GitHub turns spaces into dots); each signature goes up
          # under its installer's new name plus .sig.
          copy() { cp "$1" "out/$2"; [ -f "$1.sig" ] && cp "$1.sig" "out/$2.sig"; true; }
          if [ "${{ matrix.platform }}" = "windows" ]; then
            copy "$(ls "$bundle"/nsis/*_"${v}"_x64-setup.exe | head -1)" "${name}_x64-setup.exe"
          else
            copy "$(ls "$bundle"/appimage/*_"${v}"_amd64.AppImage | head -1)" "${name}_amd64.AppImage"
            copy "$(ls "$bundle"/deb/*_"${v}"_amd64.deb | head -1)" "${name}_amd64.deb"
            copy "$(ls "$bundle"/rpm/*-"${v}"-1.x86_64.rpm | head -1)" "${name}_x86_64.rpm"
          fi
          (cd out && for f in *; do case "$f" in *.sig) ;; *) sha256sum "$f" > "$f.sha256" ;; esac; done)
          ls -la out
          gh release upload "v$v" out/* --clobber

  # latest.json, written from the signatures on the release, so it can never
  # name a file that isn't there.
  manifest:
    needs: [check, create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          V: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p sigs && cd sigs
          gh release download "v$V" --repo "$REPO" --pattern '*.sig'
          node -e '
            const fs = require("fs");
            const v = process.env.V, base = `https://github.com/${process.env.REPO}/releases/download/v${v}/`;
            const entry = (file) => fs.existsSync(`${file}.sig`) ? { signature: fs.readFileSync(`${file}.sig`, "utf8").trim(), url: base + file } : null;
            const name = `Kryoto-Minecraft-Launcher_${v}`;
            const win = entry(`${name}_x64-setup.exe`);
            const appimage = entry(`${name}_amd64.AppImage`);
            const deb = entry(`${name}_amd64.deb`);
            const rpm = entry(`${name}_x86_64.rpm`);
            if (!win || !appimage) {
              console.error("::error::A Windows or AppImage signature is missing; not writing a latest.json that would strand one platform.");
              process.exit(1);
            }
            // The updater looks for {os}-{arch}-{installer} first; the plain
            // windows key is for copies that ask without the installer type.
            const platforms = { "windows-x86_64-nsis": win, "windows-x86_64": win, "linux-x86_64-appimage": appimage };
            if (deb) platforms["linux-x86_64-deb"] = deb;
            if (rpm) platforms["linux-x86_64-rpm"] = rpm;
            fs.writeFileSync("latest.json", JSON.stringify({ version: v, notes: "See CHANGELOG.md", pub_date: new Date().toISOString(), platforms }, null, 2));
          '
          cat latest.json
          gh release upload "v$V" latest.json --repo "$REPO" --clobber

  publish:
    needs: [check, create-release, build, manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release edit "v${{ needs.check.outputs.version }}" --repo "$REPO" --draft=false --latest
