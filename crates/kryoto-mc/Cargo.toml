[package]
name = "kryoto-mc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The Minecraft engine of Kryoto Minecraft Launcher: versions, downloads, Java, loaders, mods, accounts, launching."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "macros", "process", "rt-multi-thread"] }
futures-util = "0.3"
# Mojang's and Modrinth's files are checked by SHA-1; offline profiles' UUIDs are MD5-based.
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"
# Natives, Forge installers and mod metadata are all zip files.
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
url = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
getrandom = "0.2"
# Local times for the game log's lines.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
